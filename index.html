<!doctype html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docdeck</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app-layout">
      <header id="header-bar">
        <div class="header-controls">
          <button id="toggle-autosort-btn" title="Toggle Auto-sort by Last Modified">
            &#9889; Auto-Sort: OFF
          </button>
          <button id="toggle-inbox-btn" title="Toggle the browse list">
            &#9993; Browse: ON
          </button>
          <button id="toggle-toc-btn" title="Toggle Table of Contents">
            &#9776; Outline: OFF
          </button>
          <button id="toggle-frontmatter-btn" title="Toggle Document Metadata">
            &#9881; Frontmatter: ON
          </button>
          <button id="toggle-theme-btn" title="Toggle Light/Dark Theme">
            &#9788; Theme: Dark
          </button>
          <button id="toggle-watches-btn" title="View and edit the watch configuration">
            &#128065; Watches
          </button>
        </div>
      </header>

      <aside id="sidebar" aria-label="Documents"></aside>
      <div
        id="sidebar-resizer"
        class="layout-resizer layout-resizer--vertical"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Resize the document sidebar"
      ></div>
      <nav id="toc-panel" hidden aria-label="Table of contents"></nav>
      <div
        id="toc-resizer"
        class="layout-resizer layout-resizer--vertical"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Resize the document outline"
      ></div>

      <main id="content-container">
        <div id="empty-state" class="empty-placeholder">
          <p>
            No document loaded. Pick one from the sidebar, watch folders via
            <code>~/.config/docdeck/config.toml</code>, or run
            <code>docdeck &lt;file.md&gt;</code>.
          </p>
        </div>
        <article id="markdown-viewer" class="markdown-body hidden"></article>
      </main>

      <div
        id="event-log-resizer"
        class="layout-resizer layout-resizer--horizontal"
        role="separator"
        tabindex="0"
        aria-orientation="horizontal"
        aria-label="Resize the event log"
      ></div>
      <div id="event-log" class="event-log" hidden></div>
      <footer id="status-bar" class="status-bar" aria-label="Status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
